/* v5: Mobile, tablette et PC */
html{height:100%;-webkit-text-size-adjust:100%}
body{min-height:100%;overflow-x:hidden}
button{touch-action:manipulation}
@media(max-width:900px){
 .app{padding:8px;align-items:stretch}
 .card{width:100%;height:calc(100vh - 16px);min-height:620px;border-radius:22px}
 .screen{padding:18px}
}
.friendToast{position:fixed;top:92px;left:50%;transform:translate(-50%,-20px) scale(.96);width:min(420px,calc(100% - 30px));padding:18px 20px;border-radius:22px;background:linear-gradient(135deg,#221a3ddd,#101827ee);border:1px solid #ffffff24;box-shadow:0 20px 60px #0009;display:flex;align-items:center;gap:14px;z-index:20;opacity:0;pointer-events:none;transition:.28s}.friendToast.show{opacity:1;transform:translate(-50%,0) scale(1)}.friendToastIcon{font-size:38px;filter:drop-shadow(0 5px 12px #7c3aed88)}.friendToast b{display:block;font-size:16px;margin-bottom:3px}.friendToast span{font-size:13px;color:#dbeafe}.friendToast.sent{border-color:#22d3ee55}.friendToast.accepted{border-color:#34d39966}.friendToast.refused{border-color:#fb718566}@media(max-width:650px){
 header{height:64px;padding:0 12px}
 .card{height:100vh;min-height:100vh;border-radius:0;border-left:0;border-right:0}
 .screen{height:calc(100% - 64px);padding:13px}
 .logo{width:38px;height:38px;border-radius:13px;font-size:20px}
 .title{font-size:16px}.sub{font-size:10px}
 .headerBtns{gap:4px}.headerBtns .btn{font-size:11px;padding:8px 9px}
 .welcome h2,.menu h2{font-size:28px;line-height:1.1}
 .welcome>p{font-size:14px}
 .rules,.profileGrid,.menuGrid{grid-template-columns:1fr;gap:10px}
 .rule,.item{border-radius:16px;padding:14px}
 .menu{margin:5px auto}
 .menuBtn{min-height:76px;padding:15px;border-radius:16px}
 .menuBtn small{font-size:11px}
 .chat{height:calc(100vh - 145px);min-height:420px}
 .chatHead{padding:11px}
 .messages{padding:11px}
 .msg{max-width:88%;font-size:14px}
 .composer{padding:9px;gap:6px}

 .modalBtns .btn{flex:1;min-width:120px}
 .avatar{width:74px;height:74px;font-size:31px}
 input,select{font-size:16px} /* évite le zoom automatique sur iPhone */
}
@media(min-width:651px) and (max-width:1000px){

header{position:relative}

.profilePremium{max-width:1120px;margin:0 auto}

function showSavedToast(title, message){
  let el=document.getElementById("savedToast");
  if(!el){el=document.createElement("div");el.id="savedToast";el.className="toastSaved";document.body.appendChild(el);}
  el.innerHTML=`<div class="toastSavedIcon">✓</div><div><b>${esc(title)}</b><span>${esc(message)}</span></div>`;
  el.classList.add("show");clearTimeout(window.__savedToastTimer);
  window.__savedToastTimer=setTimeout(()=>el.classList.remove("show"),3200);
}
function showFriendToast(type,title,message){
  let el=document.getElementById("friendToast");
  if(!el){el=document.createElement("div");el.id="friendToast";document.body.appendChild(el);}
  const icons={sent:"💌✨",accepted:"💖🎉",refused:"💔✨",offline:"⚫📡"};
  el.className="friendToast "+type;
  el.innerHTML=`<div class="friendToastIcon">${icons[type]||"✨"}</div><div><b>${esc(title)}</b><span>${esc(message)}</span></div>`;
  el.classList.add("show");clearTimeout(window.__friendToastTimer);

}
function finishLogin(){
  const nameInput=$("name"), ageInput=$("age"), serverInput=$("server");

let quizQuestions=[];
let lastQuizIds=[];

function shuffleQuizArray(arr){
  const copy=[...arr];
  for(let i=copy.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [copy[i],copy[j]]=[copy[j],copy[i]];
  }
  return copy;
}

function startNewQuizRound(){
  // On évite de reprendre immédiatement les mêmes questions que la partie précédente.
  let pool=quizBank.filter(q=>!lastQuizIds.includes(q.id));
  if(pool.length<3) pool=[...quizBank];
  quizQuestions=shuffleQuizArray(pool).slice(0,3).map(q=>{
    const answers=q.a.map((label,index)=>({label,correct:index===q.c}));
    const shuffled=shuffleQuizArray(answers);
    return {
      id:q.id,
      q:q.q,
      a:shuffled.map(x=>x.label),
      c:shuffled.findIndex(x=>x.correct)
    };
  });
  lastQuizIds=quizQuestions.map(q=>q.id);
}

function drawMemory(){const b=$('memoryBoard');if(!b)return;b.innerHTML='';memoryDeck.forEach((x,i)=>{const open=memoryOpen.includes(i)||x===null;const bt=document.createElement('button');bt.className='memoryCard'+(open?' flipped':'');bt.textContent=open?(x===null?'✅':x):'❓';bt.disabled=x===null;bt.onclick=()=>flipMemory(i);b.appendChild(bt)});}
function flipMemory(i){if(memoryLock||memoryOpen.includes(i)||memoryDeck[i]===null)return;memoryOpen.push(i);drawMemory();if(memoryOpen.length===2){memoryLock=true;const [a,b]=memoryOpen;if(memoryDeck[a]===memoryDeck[b]){setTimeout(()=>{memoryDeck[a]=memoryDeck[b]=null;memoryOpen=[];memoryMatched+=2;memoryLock=false;drawMemory();if(memoryMatched===memoryDeck.length){$('memoryResult').textContent='🎉 Tu as gagné !';gameXP(30);}},350)}else{setTimeout(()=>{memoryOpen=[];memoryLock=false;drawMemory()},650)}}}

/* ===== Morpion corrigé ===== */
let morpionBoard = [];
let morpionOver = false;
let morpionBotBusy = false;
let morpionTurn = "X";
const morpionWins = [
  [0,1,2],[3,4,5],[6,7,8],
  [0,3,6],[1,4,7],[2,5,8],
  [0,4,8],[2,4,6]
];

function morpionWinner(board){
  for(const line of morpionWins){
    const a=line[0], b=line[1], c=line[2];
    if(board[a] !== "" && board[a] === board[b] && board[a] === board[c]){
      return board[a];
    }
  }
  if(board.every(cell => cell !== "")) return "draw";
  return "";
}

function startMorpion(){
  morpionBoard = ["","","","","","","","",""];
  morpionOver = false;
  morpionBotBusy = false;
  morpionTurn = "X";
  drawMorpion();
}

function drawMorpion(){
  const boardEl = $("gameBoard");
  const status = $("gameStatus");
  if(!boardEl || !status) return;

  const result = morpionWinner(morpionBoard);

  if(result === "X"){
    status.textContent = "🎉 Tu as gagné ! Bravo ! Tu peux recommencer.";
    morpionOver = true;
  } else if(result === "O"){
    status.textContent = activeGameSession ? "🎉 Partie terminée !" : "🤖 Le bot a gagné ! Tu peux recommencer.";
    morpionOver = true;
  } else if(result === "draw"){
    status.textContent = "🤝 Match nul ! Tu peux recommencer.";
    morpionOver = true;
  } else if(activeGameSession){
    status.textContent = morpionTurn===activeGameSession.symbol ? "À toi de jouer !" : "⏳ Au tour de ton ami…";
  } else if(morpionBotBusy){
    status.textContent = "🤖 Le bot réfléchit…";
  } else {
    status.textContent = "À toi de jouer !";
  }

  boardEl.innerHTML = "";
  for(let i=0;i<9;i++){
    const cell = document.createElement("button");
    cell.className = "gameCell";
    cell.textContent = morpionBoard[i];
    // Une case vide reste cliquable tant que la partie n'est pas terminée.
    cell.disabled = morpionOver || morpionBotBusy || morpionBoard[i] !== "" || (activeGameSession && morpionTurn!==activeGameSession.symbol);
    cell.onclick = () => playMorpion(i);
    boardEl.appendChild(cell);
  }
}

function playMorpion(i){
  if(morpionOver || morpionBotBusy || morpionBoard[i] !== "") return;
  if(activeGameSession){
    if(morpionTurn!==activeGameSession.symbol) return;
    morpionBoard[i]=activeGameSession.symbol;
    morpionTurn=activeGameSession.symbol==="X"?"O":"X";
    if(amichatSocket&&multiplayerReady) amichatSocket.emit("gameAction",{room:activeGameSession.room,game:"morpion",type:"move",index:i,symbol:activeGameSession.symbol});
    drawMorpion();
    return;
  }

  // Le joueur place X.
  morpionBoard[i] = "X";

  // IMPORTANT : on vérifie immédiatement si le joueur a gagné.
  const playerResult = morpionWinner(morpionBoard);
  if(playerResult === "X" || playerResult === "draw"){
    drawMorpion();
    return;
  }

  // Ensuite seulement le bot joue.
  morpionBotBusy = true;
  drawMorpion();

  setTimeout(() => {
    if(morpionOver) return;

    const move = bestMorpionMove(morpionBoard);
    if(move !== -1 && morpionBoard[move] === ""){
      morpionBoard[move] = "O";
    }

    morpionBotBusy = false;
    drawMorpion();
  }, 400);
}

function bestMorpionMove(board){
  // 1. Le bot gagne s'il le peut.
  for(let i=0;i<9;i++){
    if(board[i] === ""){
      board[i] = "O";
      if(morpionWinner(board) === "O"){
        board[i] = "";
        return i;
      }
      board[i] = "";
    }
  }

  // 2. Le bot bloque une victoire immédiate du joueur.
  for(let i=0;i<9;i++){
    if(board[i] === ""){
      board[i] = "X";
      if(morpionWinner(board) === "X"){
        board[i] = "";
        return i;
      }
      board[i] = "";
    }
  }

  // 3. Sinon, choix parmi les cases disponibles.
  const free = [];
  for(let i=0;i<9;i++) if(board[i] === "") free.push(i);
  if(!free.length) return -1;

  // Priorité au centre, puis coins, puis autre case.
  if(board[4] === "") return 4;
  const corners = [0,2,6,8].filter(i => board[i] === "");
  if(corners.length) return corners[Math.floor(Math.random()*corners.length)];
  return free[Math.floor(Math.random()*free.length)];
}

function restartMorpion(){
  startMorpion();
}

<!-- AmiChat v7 multiplayer client -->
<script src="https://cdn.socket.io/4.8.3/socket.io.min.js"></script>
<script>
/*
  AmiChat v7 multiplayer.
  Change SERVER_URL after deploying server/server.js to an HTTPS host.
  Do not put passwords or owner secrets here.
*/
/* Sauvegarde locale de secours : amis et messages restent après actualisation. */
function amichatStorageKey(kind){
  return "amichat_"+kind+"_"+String(user||"").trim().toLowerCase();
}
function saveSocialCache(){
  if(!user)return;
  try{localStorage.setItem(amichatStorageKey("social"),JSON.stringify({friends,requests}));}catch(e){}
}
function loadSocialCache(){
  if(!user)return;
  try{
    const d=JSON.parse(localStorage.getItem(amichatStorageKey("social"))||"null");
    if(d){
      const unique=list=>[...new Map((Array.isArray(list)?list:[]).map(x=>[
        String(x||"").trim().toLowerCase(),String(x||"").trim()
      ])).values()].filter(Boolean);
      friends=unique(d.friends);
      requests=unique(d.requests);
    }
  }catch(e){}
}
function saveMessageCache(room){
  if(!user||!room||room==="PUBLIC")return;
  try{localStorage.setItem(amichatStorageKey("messages_"+room),JSON.stringify(chatHistoryByRoom.get(room)||[]));}catch(e){}
}
function loadMessageCache(room){
  if(!user||!room||room==="PUBLIC")return [];
  try{const d=JSON.parse(localStorage.getItem(amichatStorageKey("messages_"+room))||"[]");return Array.isArray(d)?d:[];}catch(e){return []}
}

// Recharge tout de suite les amis sauvegardés : ils restent après actualisation
// et après avoir fermé/réouvert le navigateur sur le même appareil.
if(user){ loadSocialCache(); }

const SERVER_URL = "https://amischat.onrender.com"
let amichatSocket = null;
let currentRoom = null;
let multiplayerReady = false;
const chatHistoryByRoom = new Map();

function openFriendChat(friend){
  const f=String(friend||"").trim(); if(!f)return;
  const ids=[String(user).toLowerCase(),f.toLowerCase()].sort();
  currentRoom="FRIEND_"+ids.join("_").slice(0,80);
  const cached=currentRoom==="PUBLIC" ? [] : loadMessageCache(currentRoom);
  if(cached.length) chatHistoryByRoom.set(currentRoom,cached);
  const oldOpen=localOpenChat; oldOpen("💬 "+f,currentRoom);
  connectMultiplayer();
  if(amichatSocket&&multiplayerReady)amichatSocket.emit("joinRoom",{room:currentRoom,language:server});
}
function connectMultiplayer(){
  if(amichatSocket || !user || !age || +age < 10) return;
  try{
    amichatSocket = io(SERVER_URL, {transports:["websocket","polling"], timeout:5000});
    amichatSocket.on("connect", ()=>{
      multiplayerReady = true;
      amichatSocket.emit("joinServer", {name:user, age:Number(age), language:server});
      if(currentRoom) amichatSocket.emit("joinRoom", {room:currentRoom, language:server});
      console.log("AmiChat multiplayer connected");
    });
    amichatSocket.on("disconnect", ()=>{multiplayerReady=false;});
    amichatSocket.on("chatMessage", data=>{
      if(typeof data?.text!=="string") return;
      const room=String(data?.room||currentRoom||"PUBLIC");
      const h=chatHistoryByRoom.get(room)||[];
      const incoming={id:data.id||"",text:data.text,name:data.name,isOwner:!!data.isOwner};
      const sig=String(incoming.id||"")+"|"+String(incoming.name||"")+"|"+String(incoming.text||"");
      const already=h.some(x=>(x.id&&incoming.id&&x.id===incoming.id) || (!incoming.id && (String(x.name||"")+"|"+String(x.text||"")===String(incoming.name||"")+"|"+String(incoming.text||""))));
      if(!already) h.push(incoming);
      if(h.length>200)h.shift();
      chatHistoryByRoom.set(room,h);
      saveMessageCache(room);
      if(room===currentRoom && String(data.name||"").trim().toLowerCase() !== String(user||"").trim().toLowerCase()){
        const box=document.getElementById("msgs");
        if(box) localMsg(data.text,false,data.name,!!data.isOwner);
      }
    });
    amichatSocket.on("chatHistory", data=>{
      const room=String(data?.room||"PUBLIC");
      const serverHistory=Array.isArray(data?.messages)?data.messages:[];
      const cachedHistory=room==="PUBLIC" ? [] : loadMessageCache(room);
      /* Le chat public est temporaire : aucun ancien message ne revient après actualisation. */
      const history=room==="PUBLIC" ? [] : (serverHistory.length ? serverHistory : cachedHistory);
      chatHistoryByRoom.set(room,history);
      saveMessageCache(room);
      if(room===currentRoom && document.getElementById("msgs")){
        const box=document.getElementById("msgs"); box.innerHTML="";
        history.forEach(x=>localMsg(x.text,x.name===user,x.name,!!x.isOwner));
      }
    });
    amichatSocket.on("presence", data=>{
      window.AmiChatOnlineUsers = Array.isArray(data?.users) ? data.users : [];
      if(screen==="friends") render();
    });
    amichatSocket.on("socialState", data=>{
      const newRequests=Array.isArray(data?.requests)?data.requests:[];
      const newFriends=Array.isArray(data?.friends)?data.friends:[];
      const cachedFriends=Array.isArray(friends)?friends:[];
      /* Les amis restent sauvegardés, mais les demandes viennent du serveur afin qu'une
         demande acceptée/refusée disparaisse immédiatement. */
      const mergeUnique=(a,b)=>[...new Map([...(a||[]),...(b||[])].map(x=>[String(x).trim().toLowerCase(),String(x).trim()])).values()];
      friends=mergeUnique(cachedFriends,newFriends);
      requests=mergeUnique([],newRequests);
      saveSocialCache();
      render();
    });
    amichatSocket.on("profileUpdated", data=>{
      if(data?.name) { user=String(data.name).trim(); saveProfile(); }
    });
    amichatSocket.on("friendRequest", data=>{
      const from=String(data?.from||"").trim(); if(!from)return;
      if(!requests.includes(from))requests.push(from);
      saveSocialCache();
      render(); openFriendRequest(from);
    });
    amichatSocket.on("friendRequestSent", data=>{
      showFriendToast("sent","Demande envoyée ! 💌",`Ta demande d'ami a été envoyée à ${data?.to||"ton ami"}.`);
    });
    amichatSocket.on("friendAccepted", data=>{
      const f=String(data?.from||"").trim(); if(f&&!friends.includes(f))friends.push(f);
      saveSocialCache();
      render(); showFriendToast("accepted","Demande acceptée ! 💖",`${f||"Ton ami"} a accepté ta demande. Vous êtes maintenant amis ✨`);
    });
    amichatSocket.on("friendRefused", data=>{
      const f=String(data?.from||"Cette personne").trim();
      showFriendToast("refused","Demande refusée",`${f} a refusé ta demande d'ami. 💔`);
    });
    amichatSocket.on("gameInvite", data=>{
      if(!data || !data.game) return;
      const from=String(data.from||"Un ami").slice(0,20);
      const game=String(data.game);
      const gameNames={morpion:"Morpion",rps:"Pierre • Feuille • Ciseaux",quiz:"Quiz",memory:"Memory",guess:"Devine le nombre"};
      const gameName=gameNames[game]||"Mini-jeu";
      $("modalBox").innerHTML=`<div class="bigIcon" style="font-size:58px">🎮💌</div>
        <h2 style="text-align:center;margin:6px 0">Invitation à jouer !</h2>
        <p style="text-align:center;font-size:16px"><b>${esc(from)}</b> t'invite à jouer à <b>${esc(gameName)}</b> ✨</p>
        <div class="rule" style="text-align:center;margin-top:14px">🤝 Veux-tu accepter cette invitation ?</div>
        <div class="modalBtns"><button class="btn" id="gameInviteRefuse">✖ Refuser</button><button class="btn primary" id="gameInviteAccept">🎮 Accepter</button></div>`;
      $("modal").style.display="flex";
      $("gameInviteAccept").onclick=()=>{
        if(amichatSocket&&multiplayerReady) amichatSocket.emit("gameInviteResponse",{to:from,game,accepted:true});
        closeModal();
        showGameInviteNotice("accepted","Invitation acceptée ! 🎉",`Connexion à la partie avec ${from}… 🤝`);
      };
      $("gameInviteRefuse").onclick=()=>{
        if(amichatSocket&&multiplayerReady) amichatSocket.emit("gameInviteResponse",{to:from,game,accepted:false});
        closeModal();
      };
    });
    amichatSocket.on("gameStart", data=>{
      const game=String(data?.game||"");
      if(!game||!data?.room)return;
      const inviter=String(data.from||"");
      activeGameSession={room:String(data.room),game,symbol:key(user)===key(inviter)?"X":"O",peer:key(user)===key(inviter)?String(data.to||"Ton ami"):String(data.from||"Ton ami")};
      selectedGame=game; screen="game"; gameXPClaimed=false; closeModal(); render();
      showGameInviteNotice("accepted","Partie prête ! 🎮",`Tu joues maintenant avec ${activeGameSession.symbol==='X'?data.to:data.from} 🤝`);
    });
    amichatSocket.on("gameAction", data=>{
      if(!activeGameSession||String(data?.room)!==activeGameSession.room||data?.game!==activeGameSession.game)return;
      if(data.game==="morpion"&&data.type==="move"){
        const i=Number(data.index); const sym=data.symbol;
        if(i>=0&&i<9&&morpionBoard[i]===""){
          morpionBoard[i]=sym; morpionTurn=sym==="X"?"O":"X"; drawMorpion();
        }
      }
      /* Actions multijoueur pour les autres mini-jeux. */
      if(data.game==="rps"&&data.type==="choice"&&window.__amiGameMultiReceive) window.__amiGameMultiReceive(data);
      if(data.game==="quiz"&&data.type==="answer"&&window.__amiGameMultiReceive) window.__amiGameMultiReceive(data);
      if(data.game==="memory"&&(data.type==="flip"||data.type==="resolve")&&window.__amiGameMultiReceive) window.__amiGameMultiReceive(data);
      if(data.game==="guess"&&data.type==="guess"&&window.__amiGameMultiReceive) window.__amiGameMultiReceive(data);
    });
    amichatSocket.on("gameInviteResponse", data=>{
      const from=String(data?.from||"Ton ami").trim();
      const gameNames={morpion:"Morpion",rps:"Pierre • Feuille • Ciseaux",quiz:"Quiz",memory:"Memory",guess:"Devine le nombre"};
      const gameName=gameNames[String(data?.game||"")]||"le jeu";
      if(data?.accepted) showGameInviteNotice("accepted","Invitation acceptée ! 🎉",`${from} a accepté ton invitation pour ${gameName} 🤝`);
      else showGameInviteNotice("refused","Invitation refusée",`${from} a refusé ton invitation pour ${gameName}.`);
    });
    amichatSocket.on("serverError", data=>{
      console.warn("AmiChat:", data?.message);
      const message=String(data?.message||"");
      if(!message)return;
      if(/n'est pas connecté|pas connecté|connecté actuellement/i.test(message)){
        showFriendToast("offline","Personne non connectée ⚫",message);
      }else{
        alert("⚠️ "+message);
      }
    });
    amichatSocket.on("ownerStatus", data=>{
      if(data?.ok){
        isOwner=true;
        $("modalBox").innerHTML=`<div class="bigIcon" style="font-size:64px">👑✨</div>
          <h2 style="text-align:center;margin:6px 0">Bienvenue, Propriétaire !</h2>
          <p style="text-align:center;font-size:16px">Le code est correct. Tu as maintenant accès à l'espace propriétaire 🛡️</p>
          <div class="rule profileCard"><span class="badge">👑 PROPRIÉTAIRE</span><p class="muted">Connexion réussie ✨</p></div>
          <div class="modalBtns"><button class="btn primary" onclick="closeModal();screen='mod';render()">🛡️ Continuer</button></div>`;
        $("modal").style.display="flex";
      }
      else { alert(data?.message || "Accès refusé."); const input=$("ownerCode"); if(input){input.value="";input.focus();} }
    });
  }catch(e){ console.warn("Multiplayer unavailable",e); }
}

const localMsg = window.msg;
window.msg = function(text,mine,who,owner=false){
  if(mine) addMessageXP();
  localMsg(text,mine,who,owner || (mine && isOwner));
  if(mine && amichatSocket && multiplayerReady && currentRoom){
    amichatSocket.emit("chatMessage",{room:currentRoom,text:String(text).slice(0,300)});

<script>
/* ===== Parties avec un vrai ami : tous les mini-jeux =====
   Ajout ciblé : aucun changement au reste de l'application. */
(function(){
  const oldRenderSelectedGame = window.renderSelectedGame || renderSelectedGame;
  const multi = {
    rps:{mine:null,other:null},
    quiz:{answers:{},done:false},
    memory:{deck:[],open:[],matched:[],lock:false},
    guess:{target:0,tries:{},won:false,last:""}
  };
  function roomSeed(room){
    let n=0; for(const c of String(room||"")) n=((n*31)+c.charCodeAt(0))>>>0; return n||1;
  }
  function rand(seed){ let x=seed>>>0; return ()=>{x=(x*1664525+1013904223)>>>0;return x/4294967296}; }
  function emitAction(type,payload={}){
    if(activeGameSession&&amichatSocket&&multiplayerReady)
      amichatSocket.emit("gameAction",{room:activeGameSession.room,game:activeGameSession.game,type,...payload});
  }
  function isMulti(g){return !!(activeGameSession&&activeGameSession.game===g);}
  function peer(){return activeGameSession?.peer||"ton ami";}

  function rpsMulti(choice){
    if(multi.rps.mine) return;
    multi.rps.mine=choice; emitAction("choice",{choice});
    drawRpsMulti();
  }
  function rpsWin(a,b){
    if(a===b)return "🤝 Égalité !";
    return (a==="🪨"&&b==="✂️")||(a==="📄"&&b==="🪨")||(a==="✂️"&&b==="📄")?"🎉 Tu gagnes !":"💫 Ton ami gagne !";
  }
  function drawRpsMulti(){
    const e=$("rpsResult"); if(!e)return;
    if(multi.rps.mine&&multi.rps.other) e.textContent=`Toi ${multi.rps.mine} • ${peer()} ${multi.rps.other} — ${rpsWin(multi.rps.mine,multi.rps.other)}`;
    else if(multi.rps.mine)e.textContent="⏳ Ton choix est envoyé. Attente de ton ami…";
    else e.textContent="Choisis ton coup !";
  }

  function quizForRoom(){
    const r=rand(roomSeed(activeGameSession.room)), pool=[...quizBank], out=[];
    for(let k=0;k<3;k++){ const i=Math.floor(r()*pool.length); const q=pool.splice(i,1)[0]; out.push(q); }
    return out;
  }
  function renderQuizMulti(){
    const qs=quizForRoom(), idx=Object.keys(multi.quiz.answers).filter(k=>k.startsWith("me")).length;
    const q=qs[Math.min(idx,qs.length-1)];
    if(idx>=qs.length){
      const meScore=Object.entries(multi.quiz.answers).filter(([k,v])=>k.startsWith("me")&&v).length;
      const otherScore=Object.entries(multi.quiz.answers).filter(([k,v])=>k.startsWith("other")&&v).length;
      $("root").innerHTML=gameShell("Quiz terminé","🏆",`<div class="rule"><h3>Ton score : ${meScore}/${qs.length}</h3><h3>Score de ${esc(peer())} : ${otherScore}/${qs.length}</h3><p class="muted">Vous avez joué ensemble dans la même partie 🤝</p><div class="gameActions"><button class="btn primary" onclick="openGame('quiz')">🔄 Rejouer</button><button class="btn" onclick="inviteFriendToGame()">👥 Inviter un ami à jouer</button></div></div>`);
      return;
    }
    $("root").innerHTML=gameShell("Quiz","🧠",`<div class="rule"><div class="gameHint">🤝 Partie avec ${esc(peer())}</div><div class="badge">Question ${idx+1}/${qs.length}</div><h3>${esc(q.q)}</h3>${q.a.map((x,i)=>`<button class="btn quizOption" onclick="window.__amiQuizAnswer(${i})">${esc(x)}</button>`).join("")}<div class="gameResult">Réponds puis ton ami répond de son côté.</div></div>`);
  }
  window.__amiQuizAnswer=function(i){
    const qs=quizForRoom(), idx=Object.keys(multi.quiz.answers).filter(k=>k.startsWith("me")).length, q=qs[idx];
    const ok=i===q.c; multi.quiz.answers["me"+idx]=ok; emitAction("answer",{index:idx,correct:ok});
    renderQuizMulti();
  };

  function memoryDeckForRoom(){
    if(multi.memory.deck.length)return multi.memory.deck;
    const a=["🍀","⭐","🎮","💜","🍀","⭐","🎮","💜"], r=rand(roomSeed(activeGameSession.room));
    for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
    multi.memory.deck=a; return a;
  }
  function drawMemoryMulti(){
    const b=$("memoryBoard"); if(!b)return; const deck=memoryDeckForRoom(); b.innerHTML="";
    deck.forEach((x,i)=>{const done=multi.memory.matched.includes(i), open=done||multi.memory.open.includes(i);
      const bt=document.createElement("button");bt.className="memoryCard"+(open?" flipped":"");bt.textContent=open?(done?"✅":x):"❓";bt.disabled=done||multi.memory.lock;bt.onclick=()=>flipMemoryMulti(i);b.appendChild(bt);
    });
    if(multi.memory.matched.length===deck.length)$("memoryResult").textContent="🎉 Vous avez trouvé toutes les paires ensemble !";
  }
  function flipMemoryMulti(i){
    if(multi.memory.lock||multi.memory.open.includes(i)||multi.memory.matched.includes(i))return;
    multi.memory.open.push(i); emitAction("flip",{index:i}); drawMemoryMulti();
    if(multi.memory.open.length===2){
      multi.memory.lock=true; const [a,b]=multi.memory.open, deck=memoryDeckForRoom();
      if(deck[a]===deck[b]) setTimeout(()=>{multi.memory.matched.push(a,b);multi.memory.open=[];multi.memory.lock=false;emitAction("resolve",{matched:[a,b]});drawMemoryMulti();},350);
      else setTimeout(()=>{multi.memory.open=[];multi.memory.lock=false;emitAction("resolve",{matched:[]});drawMemoryMulti();},650);
    }
  }

  function guessTarget(){if(!multi.guess.target)multi.guess.target=(roomSeed(activeGameSession.room)%20)+1;return multi.guess.target;}
  function guessMulti(){
    const inp=$("guessInput"),out=$("guessResult"),n=Number(inp?.value); if(!n||n<1||n>20)return;
    const target=guessTarget();multi.guess.tries.me=(multi.guess.tries.me||0)+1;
    let text=n===target?`🎉 Tu as trouvé ${target} !`:n<target?"⬆️ Plus grand !":"⬇️ Plus petit !";
    if(n===target)multi.guess.won=true; emitAction("guess",{n,text,won:n===target,tries:multi.guess.tries.me});out.textContent=text;if(inp)inp.value="";
  }

  window.renderSelectedGame=function(r){
    if(!activeGameSession) return oldRenderSelectedGame(r);
    const g=selectedGame;
    if(g==="morpion") return oldRenderSelectedGame(r);
    if(g==="rps"){
      r.innerHTML=gameShell("Pierre • Feuille • Ciseaux","🪨📄✂️",`<div class="rule"><p>🤝 Tu joues avec <b>${esc(peer())}</b></p><div class="rpsChoices"><button class="btn" onclick="window.__amiRps('🪨')">🪨</button><button class="btn" onclick="window.__amiRps('📄')">📄</button><button class="btn" onclick="window.__amiRps('✂️')">✂️</button></div><div id="rpsResult" class="gameResult">Choisis ton coup !</div></div>`);drawRpsMulti();return;
    }
    if(g==="quiz"){multi.quiz.answers={};renderQuizMulti();return;}
    if(g==="memory"){multi.memory={deck:[],open:[],matched:[],lock:false};r.innerHTML=gameShell("Memory","🃏",`<div class="rule"><div class="gameHint">🤝 Partie avec ${esc(peer())}</div><div id="memoryBoard" class="memoryBoard"></div><div id="memoryResult" class="gameResult"></div></div>`);drawMemoryMulti();return;}
    if(g==="guess"){multi.guess={target:0,tries:{},won:false,last:""};r.innerHTML=gameShell("Devine le nombre","🔢",`<div class="rule"><p>🤝 Toi et <b>${esc(peer())}</b> cherchez le même nombre entre <b>1 et 20</b>.</p><input id="guessInput" class="guessInput" type="number" min="1" max="20" placeholder="Ton nombre"><button class="btn primary" onclick="window.__amiGuess()">Deviner 🎯</button><div id="guessResult" class="gameResult"></div></div>`);return;}
    return oldRenderSelectedGame(r);
  };
  window.__amiRps=rpsMulti; window.__amiGuess=guessMulti;


  window.__amiGameMultiReceive=function(data){
      const t=data.type;
      if(data.game==="rps"&&t==="choice"){multi.rps.other=data.choice;drawRpsMulti();}
      if(data.game==="quiz"&&t==="answer"){multi.quiz.answers["other"+data.index]=!!data.correct;}
      if(data.game==="memory"){
        if(t==="flip"&&!multi.memory.open.includes(Number(data.index))){multi.memory.open.push(Number(data.index));drawMemoryMulti();}
        if(t==="resolve"){multi.memory.open=[];if(Array.isArray(data.matched)&&data.matched.length)multi.memory.matched.push(...data.matched.filter(i=>!multi.memory.matched.includes(i)));drawMemoryMulti();}
      }
      if(data.game==="guess"&&t==="guess"){multi.guess.tries.other=data.tries;const e=$("guessResult");if(e)e.textContent=`${esc(peer())} : ${data.text}`;}
  };

})();
</script>
</script>

<!-- CrazyGames SDK: chargé après l'interface pour éviter une page vide -->
<script>
(function(){
  const s=document.createElement("script");
  s.src="https://sdk.crazygames.com/crazygames-sdk-v3.js";
  s.async=true;
  s.onload=async()=>{
    try{
      if(window.CrazyGames?.SDK?.init) await window.CrazyGames.SDK.init();
    }catch(e){ console.log("CrazyGames SDK unavailable outside CrazyGames preview."); }
  };
  s.onerror=()=>console.log("CrazyGames SDK could not load; AmiChat still works.");
  document.head.appendChild(s);
})();
</script>
<script>
window.addEventListener("error",()=>{
  const root=document.getElementById("root");
  if(root && !root.innerHTML.trim()){
    root.innerHTML='<div class="welcome"><div class="bigIcon">💬</div><h2>AmiChat</h2><p>Clique sur « 📜 Règles » pour continuer.</p></div>';
  }
});
</script>

<script>
/* Petit son uniquement pour les clics normaux de l'interface */
(function(){
  let soundEnabled=true;
  document.addEventListener("click",function(e){
    if(!soundEnabled) return;
    const el=e.target.closest("button");
    if(!el || el.disabled) return;
    try{
      const Ctx=window.AudioContext||window.webkitAudioContext;
      if(!Ctx) return;
      const ctx=window.__amiChatAudio||(window.__amiChatAudio=new Ctx());
      const o=ctx.createOscillator(), g=ctx.createGain();
      o.type="sine"; o.frequency.value=520;
      g.gain.setValueAtTime(0.035,ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.07);
      o.connect(g);g.connect(ctx.destination);
      o.start();o.stop(ctx.currentTime+0.07);
    }catch(err){}
  });
})();
</script>
